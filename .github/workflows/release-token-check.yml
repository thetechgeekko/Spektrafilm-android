# Manual preflight for the RELEASE_GITHUB_TOKEN environment secret.
#
# release.yml runs the same check (tools/release/check_release_token.sh) as its
# first protected job, before the candidate build. Dispatch this one after
# rotating the token and before pushing a v* tag, so a bad token never costs a
# tag at all. Fine-grained tokens expire: v1.0.0 run 42975413550 passed signing
# and device smoke, then failed its final upload with HTTP 401 "Bad credentials".
name: Release token check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-check:
    name: Exercise RELEASE_GITHUB_TOKEN
    runs-on: ubuntu-latest
    environment: release-signing
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Exercise the publishing token
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          CHECK_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash tools/release/check_release_token.sh
