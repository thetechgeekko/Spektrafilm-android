org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 defaults to creating unit-test components only for the tested build type;
# :app sets testBuildType = "release" for the signed-candidate gate while CI and the
# docs run :app:testDebugUnitTest. Keep the AGP 8 behavior (debug + release unit tests)
# until the unit-test lane is deliberately re-pointed at the release variant.
android.onlyEnableUnitTestForTheTestedBuildType=false
