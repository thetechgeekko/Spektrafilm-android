[versions]
agp = "9.5.0"
kotlin = "2.4.21"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
# Owner decision (2026-09-10): take Material 3 Expressive now. MaterialExpressiveTheme,
# MotionScheme and ExperimentalMaterial3ExpressiveApi are `internal` in 1.4.0 (the latest
# stable) and only become public in 1.5.0, which has no beta yet. Pinned ABOVE the BOM.
material3 = "1.5.0-rc01"
junit = "4.13.2"
datastore = "1.3.0"
exifinterface = "1.3.7"
orgJson = "20231013"
# Navigation 3 (#274). Check the stable channel before bumping.
navigation3 = "1.2.1"
# JVM Compose UI tests (#280). Check for the newest stable before bumping.
robolectric = "4.17"
# Jetpack WindowManager: fold posture for the editor layout (#293). Already on the runtime
# classpath transitively at this version; declared so the app can compile against it.
window = "1.5.1"
# Material 3 adaptive: ListDetailPaneScaffold for Settings and Library albums (#457).
# Stable 1.3.0 (2026-08-12); 1.4.0 is alpha. Check the stable channel before bumping.
material3Adaptive = "1.3.0"
# Launch screen on every API level (MAD audit fix 4). Check the stable channel before bumping.
coreSplashscreen = "1.0.1"
# Compose Preview Screenshot Testing engine for AGP test suites (MAD audit fix 5). Experimental.
screenshotEngine = "0.0.1-alpha16"
# Baseline/Startup Profiles and Macrobenchmark (#459). Newest stable on Google Maven, 2026-11-07.
benchmark = "1.5.0"
profileinstaller = "1.4.1"
litert = "2.3.0"
uiautomator = "2.4.1"
androidxTestExtJunit = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
screenshot-validation-api = { group = "com.android.tools.screenshot", name = "screenshot-validation-api", version.ref = "screenshotEngine" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
# WindowSizeClass breakpoints for the editor and Settings layouts (#457); was runtime-only.
androidx-window-core = { group = "androidx.window", name = "window-core", version.ref = "window" }
androidx-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3Adaptive" }
androidx-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "material3Adaptive" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
